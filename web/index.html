<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="보고싶은 영화">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>보고싶은 영화</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>보고싶은 영화</h1>
  <p class="sub">씨네21 전문가 별점 6.00 이상 개봉작</p>
  <div class="meta" id="meta"></div>
  <div class="seg" role="group" aria-label="정렬">
    <button data-s="new" aria-pressed="true">최신순</button>
    <button data-s="score" aria-pressed="false">평점순</button>
    <button data-s="old" aria-pressed="false">개봉일순</button>
  </div>
  <div class="seg" role="group" aria-label="상영 상태">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="on" aria-pressed="false">상영중</button>
    <button data-f="off" aria-pressed="false">종영</button>
    <button data-f="soon" aria-pressed="false">개봉예정</button>
  </div>
  <div class="findrow">
    <input id="q" type="search" placeholder="제목·감독·배우 검색" aria-label="제목, 감독, 배우 검색" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button id="mineOnly" aria-pressed="false" title="보고 싶은 영화와 본 영화만 보기">♥ 내 영화</button>
  </div>
  <div id="now"></div>
  <div class="seg years" id="years" role="group" aria-label="개봉 연도" hidden></div>
  <div id="sections"><div class="group"><div class="empty"><span class="spin"></span>불러오는 중입니다</div></div></div>
  <div class="foot">
    <p>상영 상태: KOBIS 일별 박스오피스 스크린 수(최근 8일) · 시간표: 네이버 플레이스 · OTT: 왓챠 검색, 넷플릭스는 JustWatch · 작품 정보·포스터: 씨네21</p>
    <p>기기 간 동기화: <span id="syncState">꺼짐</span> · <button class="linkbtn" id="syncBtn">설정</button></p>
    <div class="syncform" id="syncForm" hidden>
      <input id="syncToken" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="GitHub 토큰 붙여넣기" aria-label="GitHub 토큰">
      <button id="syncGo">연결</button>
    </div>
    <p class="backup">백업: <button class="linkbtn" id="mineExport">내보내기</button> · <button class="linkbtn" id="mineImport">가져오기</button>
      <input type="file" id="mineFile" accept="application/json,.json" hidden></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
