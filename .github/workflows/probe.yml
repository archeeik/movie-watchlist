name: 시험 실행 (저장하지 않음)

on:
  workflow_dispatch:
    inputs:
      args:
        description: naver_ott.py에 넘길 옵션
        default: "--sample 8"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - env:
          ARGS: ${{ inputs.args }}
        run: python scripts/naver_ott.py $ARGS --out naver_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naver-result
          path: naver_result.json
          if-no-files-found: ignore
