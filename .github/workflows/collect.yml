name: 데이터 갱신

# 시각은 UTC. KST = UTC + 9시간. 예약 실행은 GitHub 사정으로 몇 분~수십 분 늦어질 수 있다.
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST — 상영시간표 + 상영 상태(KOBIS)
    - cron: "0 8 * * 5"    # 금요일 17:00 KST — 씨네21 새 개봉작·별점
    - cron: "0 0 * * 6"    # 토요일 09:00 KST — 씨네21 새 개봉작·별점
    - cron: "0 18 * * 0"   # 월요일 03:00 KST — OTT(넷플릭스·왓챠)
  workflow_dispatch:
    inputs:
      what:
        description: 무엇을 갱신할까요
        type: choice
        default: daily
        options: [daily, cine21, ott, ott-all, all]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt

      - name: 무엇을 돌릴지 정하기
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          WHAT: ${{ inputs.what }}
        run: |
          case "${WHAT:-$SCHEDULE}" in
            "0 22 * * *"|daily)             echo "run=showtimes kobis" ;;
            "0 8 * * 5"|"0 0 * * 6"|cine21) echo "run=cine21 kobis" ;;
            "0 18 * * 0"|ott)               echo "run=ott" ;;
            ott-all)                        echo "run=ott-all" ;;
            all)                            echo "run=cine21 showtimes kobis ott-all" ;;
            *) echo "알 수 없는 실행 조건: ${WHAT:-$SCHEDULE}"; exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

      # 하나가 실패해도 나머지는 계속 돌리고, 받은 만큼은 저장한 뒤 마지막에 실패로 표시한다
      - name: 수집
        id: run
        env:
          RUN: ${{ steps.plan.outputs.run }}
        run: |
          failed=""
          for s in $RUN; do
            echo "::group::$s"
            if [ "$s" = "ott-all" ]; then python scripts/ott.py --all; else python "scripts/$s.py"; fi || failed="$failed $s"
            echo "::endgroup::"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "데이터 갱신: ${{ steps.plan.outputs.run }}"
            git pull --rebase
            git push
          fi

      - name: 실패 알림 (이슈)
        if: steps.run.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.run.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="수집 실패:${FAILED}"$'\n\n'"기록: ${RUN_URL}"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "수집 실패 in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "수집 실패" --body "$body"
          fi
          exit 1   # 실행을 실패로 남겨 GitHub의 실패 메일도 가게 한다

  # 봇이 올린 커밋은 다른 워크플로를 깨우지 않으므로 여기서 직접 배포한다
  deploy:
    needs: collect
    if: always()
    uses: ./.github/workflows/deploy.yml
